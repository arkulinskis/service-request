<div class="ui sr-dlg">
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="text_label" prop:role='["muted", "dlg-lead"]'></anvil-component>
  <div class="ui-stack">
    <div class="ui-grid two" anvil:name="numbers">
      <label class="ui-field"><span anvil:dom-node="num1_cap">Amount</span><anvil-component type="TextBox" name="num1_box" prop:type="number"></anvil-component></label>
      <label class="ui-field"><span anvil:dom-node="num2_cap">Amount</span><anvil-component type="TextBox" name="num2_box" prop:type="number"></anvil-component></label>
    </div>
    <label class="ui-field" anvil:name="text_field"><span anvil:dom-node="text_cap">Why?</span><anvil-component type="TextArea" name="text_box"></anvil-component></label>
    <anvil-component type="Label" name="error_label" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="back_button" prop:text="Back" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="ok_button" prop:text="OK" prop:role='["btn", "btn-primary"]'></anvil-component>
    </div>
  </div>
</div>
