<div class="ad-table ad-strike-row">
  <span><b anvil:dom-node="name"></b><span class="small muted ad-last" anvil:dom-node="last"></span></span>
  <span class="ad-email" anvil:dom-node="email"></span>
  <anvil-component type="TextBox" name="strikes_box" prop:type="number"></anvil-component>
  <anvil-component type="CheckBox" name="paused_box" prop:text="Paused"></anvil-component>
  <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-sm"]'></anvil-component>
</div>
