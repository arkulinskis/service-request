<div class="ui-card bt-person">
  <h2 class="bt-person-h" anvil:dom-node="title"></h2>
  <a class="bt-who" anvil:dom-node="who"><span class="ui-avatar" anvil:dom-node="av"></span><span><b anvil:dom-node="name"></b><span class="muted small" anvil:dom-node="sub"></span></span></a>
  <div class="bt-rec">
    <div><i class="ic ic-star"></i><span anvil:dom-node="l1"></span></div>
    <div anvil:dom-node="l2box"><i class="ic ic-bolt"></i><span anvil:dom-node="l2"></span></div>
    <div><i class="ic ic-check"></i><span anvil:dom-node="l3"></span></div>
    <div class="ui-badge warn" anvil:dom-node="warn"><i class="ic ic-info"></i>Has a warning from moderators</div>
  </div>
</div>
